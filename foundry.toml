[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64
fail_on_revert = false
